server.port=8080

# Perfil por defecto: dev (consola H2, Swagger y logs DEBUG). En producción usar SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

# H2 en modo fichero
spring.datasource.url=jdbc:h2:file:./data/huertoapp
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# H2 Console y Swagger: desactivados por defecto, solo se activan en el perfil dev
spring.h2.console.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT: el secreto NUNCA va en el repositorio. Definir la variable de entorno JWT_SECRET (mín. 32 caracteres)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# Open-Meteo (sin API key)
app.weather.base-url=https://api.open-meteo.com/v1
app.weather.geocoding-url=https://geocoding-api.open-meteo.com/v1

# Logging
logging.level.com.huertoapp=INFO

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
